<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pásalo | Explorar</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .btn-fav { background: transparent; border: none; color: #64748b; font-size: 1.3rem; cursor: pointer; position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; z-index: 10; }
    .btn-fav.active { color: #ef4444; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><i class="fa-solid fa-graduation-cap"></i> Pásalo<span>.</span></a>
    
    <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('active')">
      <i class="fa-solid fa-bars"></i>
    </button>

    <nav>
      <a href="explorar.html"><i class="fa-solid fa-compass"></i> Explorar</a>
      <a href="mis_publicaciones.html"><i class="fa-solid fa-box"></i> Mis publicaciones</a>
      <a href="favoritos.html"><i class="fa-solid fa-heart" style="color:#ef4444;"></i> Favoritos</a>
      <a href="publicar.html" class="btn-primary"><i class="fa-solid fa-plus"></i> Publicar</a>
      
            <!-- BOTÓN DE MENSAJES -->
      <button onclick="abrirModalBandejaMensajes()"><i class="fa-solid fa-comments"></i> Mensajes</button>

      <button onclick="abrirNotificaciones()" style="position: relative; display: flex; align-items: center;" id="campanaNotificaciones">
        <i class="fa-solid fa-bell"></i>
        <span id="badgeNotificaciones" style="display: none; position: absolute; top: -5px; right: -8px; background: #ef4444; color: white; font-size: 0.65rem; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; align-items: center; justify-content: center;">0</span>
      </button>

      <div class="user-menu-container">
        <button class="user-btn" onclick="toggleMenuUsuario()">
          <i class="fa-solid fa-user-circle" style="font-size: 1.4rem;"></i>
        </button>
        <div class="user-dropdown" id="dropdownUsuario">
          <a href="perfil.html"><i class="fa-solid fa-user"></i> Mi Perfil</a>
          <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Mi Impacto</a>
          <a href="admin.html" id="btnAdminNav" style="display:none; color: var(--danger); font-weight: bold;">
            <i class="fa-solid fa-shield-halved"></i> Panel Admin
          </a>
          <hr style="border-color: var(--border); margin: 0.5rem 0;">
          <button onclick="toggleTema()"><i id="iconoTema" class="fa-solid fa-sun"></i> Cambiar Tema</button>
          <button onclick="cerrarSesion()" style="color: #ef4444;"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div id="carruselDestacados" class="carrusel-container" style="display:none;"></div>

    <div class="filter-section" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
      <input type="text" id="filterBusqueda" placeholder="Buscar título, materia..." oninput="debounceCargar()">
      <select id="filterCategoria" onchange="cargarPublicaciones()"><option value="">Todas las Categorías</option></select>
      <select id="filterTipo" onchange="cargarPublicaciones()">
        <option value="">Todos los Tipos</option>
        <option value="Venta">Venta</option>
        <option value="Renta">Renta</option>
        <option value="Intercambio">Intercambio</option>
      </select>
      <input type="number" id="filterPrecioMin" placeholder="Precio Mín ($)" oninput="debounceCargar()">
      <input type="number" id="filterPrecioMax" placeholder="Precio Máx ($)" oninput="debounceCargar()">
      <select id="filterOrden" onchange="cargarPublicaciones()">
        <option value="recientes">Más recientes</option>
        <option value="menor_precio">Menor precio</option>
        <option value="mayor_precio">Mayor precio</option>
      </select>
      <button onclick="limpiarFiltros()" style="background:transparent; border:1px solid var(--border); color:var(--text-muted); padding:0.8rem; border-radius:8px; cursor:pointer;">
        <i class="fa-solid fa-eraser"></i> Limpiar
      </button>
    </div>

    <div class="grid-publications" id="publicacionesContainer">
      <p style="color: var(--text-muted);">Cargando publicaciones...</p>
    </div>
  </main>

  <!-- Modal de chat -->
  <div class="modal" id="modalChat">
    <div class="modal-content" style="max-width:800px;">
      <div class="modal-header">
        <h3 id="chatTitle">Mensajes</h3>
        <button onclick="cerrarModal('modalChat')">&times;</button>
      </div>
      <div class="messages-layout">
        <div class="conversations-list" id="listaConversaciones"></div>
        <div style="display:flex; flex-direction:column;">
          <div class="chat-box" id="chatMessages"></div>
          <form onsubmit="enviarMensaje(event)" style="display:flex; gap:0.5rem;">
            <input type="text" id="mensajeTexto" class="form-control" placeholder="Escribe un mensaje..." required>
            <button type="submit" class="btn-primary"><i class="fa-solid fa-paper-plane"></i></button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="pasalo.js"></script>
  <script>
    let debounceTimer = null;
    let misFavoritos = [];
    let carruselInterval = null;

    function debounceCargar() { clearTimeout(debounceTimer); debounceTimer = setTimeout(cargarPublicaciones, 400); }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await getUsuarioActual();
      if (user) {
        if (localStorage.getItem('es_admin') === 'true') {
          document.getElementById('btnAdminNav').style.display = 'flex';
        }
        const resFavs = await fetchAuth(`${API_URL}/favoritos/ids`);
        if (resFavs.ok) misFavoritos = await resFavs.json();
      }
      cargarCategoriasSelect(['filterCategoria']);
      cargarDestacados();
      cargarPublicaciones();
    });

    async function cargarDestacados() {
      try {
        const res = await fetch(`${API_URL}/publicaciones/destacadas`);
        if (!res.ok) return;
        const destacados = await res.json();
        const container = document.getElementById('carruselDestacados');
        if (destacados.length === 0) { container.style.display = 'none'; return; }
        container.style.display = 'block';
        container.innerHTML = '';
        destacados.forEach((pub, index) => {
          const slide = document.createElement('a');
          slide.href = `detalle.html?id=${pub.id}`;
          slide.className = `carrusel-slide ${index === 0 ? 'active' : ''}`;
          slide.innerHTML = `
            <div class="carrusel-bg" style="background-image: url('${pub.imagen}');"></div>
            <img src="${pub.imagen}" class="carrusel-img-real" alt="${escapeHtml(pub.titulo)}">
            <div class="carrusel-info">
              <span class="badge badge-${pub.tipo}" style="margin-bottom:0.5rem;">${pub.tipo} - ${pub.categoria_nombre}</span>
              <h2>${escapeHtml(pub.titulo)}</h2>
              <p>${escapeHtml(pub.descripcion || 'Sin descripción')}</p>
              <div class="precio">$${Number(pub.precio).toFixed(2)}</div>
            </div>
          `;
          container.appendChild(slide);
        });
        if (destacados.length > 1) {
          let currentSlide = 0;
          if (carruselInterval) clearInterval(carruselInterval);
          carruselInterval = setInterval(() => {
            const slides = document.querySelectorAll('.carrusel-slide');
            if (slides.length === 0) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
          }, 4000);
        }
      } catch (err) { console.error(err); }
    }

    function limpiarFiltros() {
      document.getElementById('filterBusqueda').value = '';
      document.getElementById('filterCategoria').value = '';
      document.getElementById('filterTipo').value = '';
      document.getElementById('filterPrecioMin').value = '';
      document.getElementById('filterPrecioMax').value = '';
      document.getElementById('filterOrden').value = 'recientes';
      cargarPublicaciones();
    }

    async function cargarPublicaciones() {
      const busqueda = document.getElementById('filterBusqueda').value.trim();
      const categoria_id = document.getElementById('filterCategoria').value;
      const tipo = document.getElementById('filterTipo').value;
      const precio_min = document.getElementById('filterPrecioMin').value;
      const precio_max = document.getElementById('filterPrecioMax').value;
      const orden = document.getElementById('filterOrden').value;

      const params = new URLSearchParams();
      if (busqueda) params.append('busqueda', busqueda);
      if (categoria_id) params.append('categoria_id', categoria_id);
      if (tipo) params.append('tipo', tipo);
      if (precio_min) params.append('precio_min', precio_min);
      if (precio_max) params.append('precio_max', precio_max);
      if (orden) params.append('orden', orden);

      const container = document.getElementById('publicacionesContainer');
      container.innerHTML = '<p style="color: var(--text-muted);">Cargando...</p>';

      try {
        const res = await fetch(`${API_URL}/publicaciones?${params}`);
        const publicaciones = await res.json();
        container.innerHTML = '';
        if (!publicaciones.length) { container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align:center;">No se encontraron publicaciones.</p>'; return; }

        publicaciones.forEach(pub => {
          const imgHTML = pub.imagen ? `<img src="${pub.imagen}" style="width:100%; height:180px; object-fit:cover; border-bottom: 1px solid var(--border);">` : `<div style="width:100%; height:180px; background:#334155; display:flex; align-items:center; justify-content:center; border-bottom: 1px solid var(--border);"><i class="fa-solid fa-image" style="font-size:3rem; color:#64748b;"></i></div>`;
          const isFav = misFavoritos.includes(pub.id);
          container.innerHTML += `
            <div class="card" style="position: relative;">
              <button class="btn-fav ${isFav ? 'active' : ''}" onclick="toggleFavorito(${pub.id}, this)">
                <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
              </button>
              ${imgHTML}
              <div class="card-body">
                <span class="badge badge-${escapeHtml(pub.tipo)}">${escapeHtml(pub.tipo)}</span>
                <a href="detalle.html?id=${pub.id}" class="card-title">${escapeHtml(pub.titulo)}</a>
                <div class="card-price">$${Number(pub.precio).toFixed(2)}</div>
                <p style="font-size: 0.9rem; color: #cbd5e1;">${escapeHtml((pub.descripcion || 'Sin descripción').slice(0, 90))}</p>
                <div class="card-meta"><i class="fa-solid fa-user"></i> ${escapeHtml(pub.vendedor_nombre)} | ⭐ ${Number(pub.reputacion).toFixed(1)}</div>
              </div>
              <div class="card-actions">
                <button class="btn-primary" style="width:100%;" onclick="contactar(${pub.usuario_id}, ${pub.id}, '${escapeHtml(pub.vendedor_nombre).replace(/'/g, "\\'")}')">
                  <i class="fa-solid fa-envelope"></i> Contactar
                </button>
              </div>
            </div>
          `;
        });
      } catch (err) { container.innerHTML = '<p style="color: #f87171; grid-column:1/-1;">Error al cargar publicaciones.</p>'; }
    }

    async function toggleFavorito(pubId, btnElement) {
      const user = await requireAuth();
      if (!user) return;
      const res = await fetchAuth(`${API_URL}/favoritos/${pubId}`, { method: 'POST' });
      if (res.ok) {
        const data = await res.json();
        if (data.action === 'added') { btnElement.classList.add('active'); btnElement.innerHTML = '<i class="fa-solid fa-heart"></i>'; misFavoritos.push(pubId); }
        else { btnElement.classList.remove('active'); btnElement.innerHTML = '<i class="fa-regular fa-heart"></i>'; misFavoritos = misFavoritos.filter(id => id !== pubId); }
      }
    }

    async function contactar(vendedorId, pubId, nombre) {
      const user = await requireAuth();
      if (!user) return;
      if (user.id === vendedorId) return alert('Este es tu propio artículo.');
      iniciarChatDirecto(vendedorId, pubId, nombre);
    }
  </script>
</body>
</html>
