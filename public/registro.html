<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pásalo | Registro</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <header>
    <a href="index.html" class="logo"><i class="fa-solid fa-graduation-cap"></i> Pásalo<span>.</span></a>
    <nav>
      <a href="login.html">Iniciar Sesión</a>
    </nav>
  </header>

  <main style="max-width: 460px; margin: 2rem auto;">
    <div class="card" style="padding: 2rem;">
      <h2 style="margin-bottom: 0.5rem; text-align: center;">Crear Cuenta</h2>
      <p style="text-align:center; color: var(--text-muted); font-size:0.9rem; margin-bottom: 1.5rem;">
        Regístrate con tu correo institucional
      </p>

      <div id="regError" style="display:none; background: rgba(239,68,68,0.15); color:#f87171; font-size:0.9rem; padding:0.7rem; border-radius:8px; margin-bottom:1rem; text-align:center;"></div>

      <form onsubmit="hacerRegistro(event)" style="display: flex; flex-direction: column; gap: 1rem;" novalidate>
        <div>
          <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:0.3rem;">Nombre completo</label>
          <input type="text" id="regNombre" class="form-control" placeholder="Ej. Juan Pérez" required minlength="3">
        </div>

        <div>
          <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:0.3rem;">Correo institucional</label>
          <input type="email" id="regEmail" class="form-control" placeholder="ej. juan@universidad.edu" required>
        </div>

        <div>
          <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:0.3rem;">Carrera</label>
          <input type="text" id="regCarrera" class="form-control" placeholder="Ej. Ingeniería en Sistemas">
        </div>

        <div>
          <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:0.3rem;">Contraseña</label>
          <input type="password" id="regPass" class="form-control" placeholder="Mínimo 8 caracteres" required minlength="8">
        </div>

        <div>
          <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:0.3rem;">Confirmar contraseña</label>
          <input type="password" id="regPass2" class="form-control" placeholder="Repite tu contraseña" required minlength="8">
        </div>

        <button type="submit" class="btn-primary" style="justify-content: center;" id="btnRegistro">
          Registrarme
        </button>
      </form>

      <p style="text-align:center; margin-top:1.2rem; color:var(--text-muted); font-size:0.9rem;">
        ¿Ya tienes cuenta? <a href="login.html" style="color:var(--primary); font-weight:600;">Inicia sesión</a>
      </p>
    </div>
  </main>

  <script src="pasalo.js"></script>
  <script>
    async function hacerRegistro(e) {
      e.preventDefault();

      const errorBox = document.getElementById('regError');
      const btn      = document.getElementById('btnRegistro');
      errorBox.style.display = 'none';

      const nombre  = document.getElementById('regNombre').value.trim();
      const email   = document.getElementById('regEmail').value.trim();
      const carrera = document.getElementById('regCarrera').value.trim();
      const pass1   = document.getElementById('regPass').value;
      const pass2   = document.getElementById('regPass2').value;

      // ---- Validaciones del lado del cliente ----
      if (nombre.length < 3) {
        return mostrarError('El nombre debe tener al menos 3 caracteres.');
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        return mostrarError('Ingresa un correo electrónico válido.');
      }
      if (pass1.length < 8) {
        return mostrarError('La contraseña debe tener al menos 8 caracteres.');
      }
      if (pass1 !== pass2) {
        return mostrarError('Las contraseñas no coinciden.');
      }

      // ---- Envío al servidor ----
      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';

      try {
        const res = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, carrera, password: pass1 })
        });

        const data = await res.json();

        if (res.ok) {
          // El servidor devuelve un token JWT; guardarlo para conservar la sesión.
          localStorage.setItem('token_pasalo', data.token);
          btn.textContent = '¡Cuenta creada!';
          window.location.href = 'explorar.html';
          return;
        }

        // Errores del servidor (email duplicado, validación, etc.)
        mostrarError(data.error || 'No se pudo crear la cuenta.');
      } catch (err) {
        console.error(err);
        mostrarError('Error de conexión con el servidor. ¿Está corriendo el backend?');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Registrarme';
      }
    }

    function mostrarError(msg) {
      const errorBox = document.getElementById('regError');
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
